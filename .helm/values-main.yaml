replicaCount: 1

image:
  repository: git-ci-cd.smartalmaty.kz:8443/opendata/monitoring-seismic
  pullPolicy: IfNotPresent
  tag: "latest"

env:
  open:
    - name: "test"
      value: "test"

imagePullSecrets:
  - name: regcred
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: opendata.smartalmaty.kz
      paths:
        - path: /monitoring-seismic(|$)(.*)
          pathType: ImplementationSpecific
  tls:
    - secretName: smartalmaty-wildcard-0
      hosts:
        - opendata.smartalmaty.kz

resources:
  requests:
    cpu: 0.2
    memory: 256Mi
  limits:
    cpu: 1
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []
affinity: {}

